services:
  naver-shopping-scraper:
    build: .
    restart: unless-stopped
    shm_size: "1gb"
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # Optional — Naver answers most connections directly, so leave this unset.
      # - NAVER_SHOPPING_PROXY=http://user:pass@host:port
